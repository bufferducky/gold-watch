name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.lock
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check .
      - run: node --check gold_watch/static/app.js
      - run: npm ci
      - run: npm test
      - run: docker build -t gold-watch:ci .
